<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boleiro · Coletiva</title>
<link rel="stylesheet" href="../../packages/design-tokens/album.css">
<link rel="stylesheet" href="mock.css">
<link rel="stylesheet" href="hub.css">
<script src="mock.js"></script>
<script src="hub.js"></script>
<style>
.veil { position: absolute; inset: 28px 0 0; background: var(--veil); z-index: 10; }
.pop { position: absolute; left: 50%; top: 116px; width: 736px; margin-left: -352px; z-index: 11; background: var(--card); border-radius: 16px; box-shadow: var(--sh-pop); overflow: hidden; }

.wall { height: 118px; position: relative; background: #FFFFFF; display: grid; grid-template-columns: repeat(10, 1fr); grid-auto-rows: 40px; border-bottom: 3px solid var(--ink); box-shadow: inset 0 -12px 18px -14px rgba(20,35,26,.25); }
.wall > span { display: grid; place-items: center; }
.wall .bt { height: 16px; padding: 0 5px; border-radius: 3px; background: #fff; display: grid; place-items: center; box-shadow: 0 0 0 1px rgba(20,35,26,.1); }
.ctx { position: absolute; left: 20px; top: 16px; z-index: 2; display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--card); border-radius: 999px; padding: 5px 12px 5px 6px; font-weight: 700; font-size: 12px; }
.ctx b { background: var(--red); color: #fff; font-stretch: var(--semi); font-weight: 900; font-size: 10px; letter-spacing: .08em; padding: 3px 7px; border-radius: 999px; display: inline-flex; gap: 5px; align-items: center; }
.ctx b i { font-size: 8px; }
.x { position: absolute; right: 16px; top: 14px; z-index: 2; width: 30px; height: 30px; border-radius: 50%; background: var(--card); display: grid; place-items: center; box-shadow: 0 0 0 1.5px var(--line-2); color: var(--ink-2); }

.q { position: relative; z-index: 2; margin: -46px 24px 0 24px; display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: end; }
.rep { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; }
.rep .av { width: 64px; height: 64px; font-size: 24px; border-width: 4px; background: #1B3F9E; }
.rep b { font-weight: 800; font-size: 12px; line-height: 1.1; text-align: center; }
.rep small { font-size: 11px; color: var(--mute); }
.bub { position: relative; background: var(--card); border-radius: 14px; padding: 14px 18px 15px; box-shadow: var(--sh-lift); transform: rotate(-.8deg); margin-bottom: 18px; }
.bub::before { content: ''; position: absolute; left: -9px; bottom: 18px; width: 18px; height: 18px; background: var(--card); transform: rotate(45deg); border-radius: 3px; }
.bub p { position: relative; font-stretch: var(--semi); font-weight: 800; font-size: 18px; line-height: 1.3; }
.bub small { position: relative; display: block; font-size: 12px; color: var(--mute); margin-top: 6px; }
.bub small b { color: var(--ink-2); }

.ans { padding: 6px 24px 0; display: grid; gap: 8px; }
.fxh { display: flex; justify-content: flex-end; gap: 5px; padding-right: 14px; }
.fxh span { width: 66px; text-align: center; font-size: 9.5px; letter-spacing: .05em; }
.a { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 11px 14px; border-radius: var(--r-m); box-shadow: inset 0 0 0 1.5px var(--line); }
.a .k { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line-2); font-stretch: var(--semi); font-weight: 900; font-size: 12px; }
.a b { display: block; font-weight: 700; font-size: 14px; line-height: 1.3; }
.a small { display: block; font-size: 12px; color: var(--mute); margin-top: 2px; }
.a.on { box-shadow: inset 0 0 0 2px var(--ink); background: var(--yellow-l); }
.a.on .k { background: var(--ink); color: var(--card); box-shadow: none; }
.fx { display: flex; gap: 5px; }
.fx span { width: 66px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--paper); font-stretch: var(--semi); font-weight: 900; font-size: 13px; }
.fx .up { color: var(--green); } .fx .dn { color: var(--red); } .fx .eq { color: var(--mute); font-weight: 700; }
.fx .hot { background: var(--red-l); color: var(--red); }
.foot { margin: 16px 24px 0; padding: 14px 0 18px; display: flex; align-items: center; gap: 12px; border-top: 2px dotted var(--line-2); }
.foot p { margin-right: auto; font-size: 12px; color: var(--mute); }
.foot p b { color: var(--ink); }
</style>
</head>
<body>
<script>
renderHub('mac');
const tiles = Array.from({ length: 30 }, (_, i) => ((i + Math.floor(i / 10)) % 2 ? `<span><span class="bt">${logo('logos/betano.svg', 10)}</span></span>` : `<span>${crest('FLA', 20)}</span>`)).join('');
document.querySelector('.app').insertAdjacentHTML('beforeend', `<div class="veil"></div>
<div class="pop">
  <div class="wall">${tiles}</div>
  <div class="ctx"><b><i class="ph-fill ph-circle"></i>Ao vivo</b>Coletiva antes de Bahia × Flamengo · hoje 18h30</div>
  <span class="x"><i class="ph-bold ph-x"></i></span>
  <div class="q">
    <div class="rep"><span class="av">R</span><b>Renata Moura</b><small>Jornal do Boleiro</small></div>
    <div class="bub"><p>“O Palmeiras está a um ponto e joga em Curitiba. O título passa pela Fonte Nova hoje?”</p><small>Pergunta <b>2 de 3</b> · Flamengo 64 pts, Palmeiras 63</small></div>
  </div>
  <div class="ans">
    <div class="fxh"><span class="lbl">Moral</span><span class="lbl">Diretoria</span><span class="lbl">Torcida</span><span class="lbl">Rivalidade</span></div>
    <div class="a"><span class="k">1</span><div><b>“Respeito o Palmeiras. Mas a liderança é nossa.”</b></div>
      <div class="fx"><span class="up">+3</span><span class="eq">0</span><span class="up">+2</span><span class="eq">+1</span></div></div>
    <div class="a on"><span class="k">2</span><div><b>“Quem tem que olhar a tabela é o Palmeiras. A gente depende só da gente.”</b><small>Vira manchete no jornal de segunda</small></div>
      <div class="fx"><span class="up">+5</span><span class="dn">−3</span><span class="up">+6</span><span class="hot">+4</span></div></div>
    <div class="a"><span class="k">3</span><div><b>“Não falo do Palmeiras. Falo do Flamengo.”</b></div>
      <div class="fx"><span class="eq">0</span><span class="up">+2</span><span class="dn">−2</span><span class="eq">0</span></div></div>
  </div>
  <div class="foot"><p>Rivalidade com <b>Abel Ferreira</b>: briga direta pelo título</p><button class="btn flat"><i class="ph-bold ph-user-switch"></i>O auxiliar responde</button><button class="btn go"><i class="ph-bold ph-microphone"></i>Responder</button></div>
</div>`);
</script>
</body>
</html>
