<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Boleiro · Tabelas</title>
<link rel="stylesheet" href="../../packages/design-tokens/album.css">
<link rel="stylesheet" href="mock.css">
<script src="mock.js"></script>
<style>
.wrap { height: 100%; padding: 18px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.hd { display: flex; align-items: center; gap: 12px; }
.hd .rd { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.hd .rd b { font-stretch: var(--semi); font-weight: 900; font-size: 14px; min-width: 104px; text-align: center; }
.icb { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line-2); font-size: 14px; }
.body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 318px; gap: 14px; }
.tbl { overflow: hidden; }
.tb td { height: 28px; }
.tb td.n { width: 44px; text-align: center; }
.zn { display: inline-grid; place-items: center; width: 24px; height: 20px; border-radius: 6px; font-stretch: var(--semi); font-weight: 900; font-size: 11.5px; color: var(--ink); }
.zn.lib { background: var(--green); color: #fff; }
.zn.pre { background: var(--green-l); color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.zn.sul { background: #DCE3F5; color: var(--blue); }
.zn.reb { background: var(--red); color: #fff; }
[data-theme='dark'] .zn.sul { background: #22305A; }
.tb td.cl { font-stretch: 100%; font-weight: 700; font-size: 13.5px; }
.tb td.cl span.c { display: flex; align-items: center; gap: 8px; }
.tb td.pts { font-stretch: var(--semi); font-weight: 900; font-size: 14px; }
.form { display: inline-flex; gap: 3px; vertical-align: middle; }
.form i { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; font-style: normal; font-stretch: var(--semi); font-weight: 900; font-size: 9.5px; color: #fff; }
.form .v { background: var(--green); } .form .e { background: var(--line-2); color: #14231A; } .form .d { background: var(--red); }
.mv { font-size: 11px; font-weight: 800; }
.mv.up { color: var(--green); } .mv.dn { color: var(--red); }
.tb tr.me td { background: var(--yellow-l); }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.art { padding: 14px 16px 10px; }
.art h3, .leg h3 { font-stretch: var(--wide); font-weight: 900; font-size: 17px; margin-bottom: 8px; }
.ar { display: grid; grid-template-columns: 22px 22px 1fr auto; gap: 8px; align-items: center; height: 38px; border-bottom: 1px dotted var(--line-2); font-size: 13px; }
.ar:last-child { border-bottom: 0; }
.ar .k { font-stretch: var(--semi); font-weight: 900; color: var(--mute); }
.ar b { font-weight: 800; display: block; line-height: 1.1; }
.ar small { font-size: 11.5px; color: var(--mute); }
.ar .g { font-stretch: var(--wide); font-weight: 900; font-size: 20px; }
.ar.me b { color: var(--green); }
.leg { padding: 14px 16px; font-size: 12.5px; display: grid; gap: 8px; }
.leg div { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="app">
  <div data-chrome="mac" data-title="Boleiro · Flamengo 2026"></div>
  <div data-bar="tabelas"></div>
  <main><div class="wrap">
    <div class="hd">
      <div class="seg"><span class="on">Série A</span><span>Série B</span><span>Copa do Brasil</span><span>Libertadores</span><span>Carioca</span><span>Outras ligas</span></div>
      <div class="rd"><span class="icb"><i class="ph-bold ph-caret-left"></i></span><b>30ª rodada</b><span class="icb"><i class="ph-bold ph-caret-right"></i></span></div>
    </div>
    <div class="body">
      <div class="page tbl"><table class="tb"><thead><tr><th>#</th><th class="l">Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th class="l" style="padding-left:24px">Últimos 5</th><th></th></tr></thead><tbody id="t"></tbody></table></div>
      <div class="side">
        <div class="stk art"><h3>Artilharia</h3><div id="a"></div></div>
        <div class="stk leg"><h3>Vagas</h3>
          <div><span class="zn lib">1</span>Libertadores, fase de grupos</div>
          <div><span class="zn pre">5</span>Libertadores, fase prévia</div>
          <div><span class="zn sul">6</span>Sul-Americana</div>
          <div><span class="zn reb">17</span>Rebaixados para a Série B</div>
        </div>
      </div>
    </div>
  </div></main>
</div>
<script>
// Real Série A 2026 table after round 30 (ESPN standings, 14 Oct 2026): [club, P, J, V, E, D, GP, GC, last 5, places moved in the last round]
const T = [
  ['FLA', 64, 30, 19, 7, 4, 58, 25, 'vvvev', 0], ['PAL', 63, 30, 18, 9, 3, 52, 22, 'evevv', 0], ['CAP', 53, 30, 15, 8, 7, 49, 35, 'devev', 1], ['FLU', 51, 30, 14, 9, 7, 48, 37, 'vdvvd', -1],
  ['BAH', 49, 30, 13, 10, 7, 44, 36, 'vvddv', 1], ['CRU', 48, 30, 14, 6, 10, 46, 44, 'vdvvd', -1], ['CAM', 47, 30, 13, 8, 9, 41, 35, 'vevev', 0], ['SAN', 42, 30, 11, 9, 10, 46, 45, 'vvved', 0],
  ['RBB', 40, 30, 11, 7, 12, 38, 35, 'eddev', 1], ['SAO', 39, 30, 11, 6, 13, 35, 35, 'dvddv', 1], ['CFC', 39, 30, 10, 9, 11, 38, 48, 'dedde', -2], ['VIT', 36, 30, 10, 6, 14, 33, 44, 'vedvd', 0],
  ['BOT', 36, 30, 9, 9, 12, 43, 48, 'evdde', 0], ['VAS', 35, 29, 9, 8, 12, 36, 42, 'dvvve', 0], ['MIR', 33, 30, 8, 9, 13, 34, 44, 'veved', 0], ['COR', 32, 30, 8, 8, 14, 31, 38, 'ddddd', 0],
  ['INT', 32, 30, 7, 11, 12, 33, 38, 'dvdve', 0], ['GRE', 31, 30, 7, 10, 13, 32, 40, 'ddeee', 0], ['REM', 25, 30, 5, 10, 15, 33, 48, 'dddee', 0], ['CHA', 18, 29, 3, 9, 17, 30, 61, 'vdedd', 0],
];
// 2026 regulation: 1-4 Libertadores group stage, 5 qualifiers, 6-11 Sul-Americana, 17-20 relegated.
const zone = (i) => i < 4 ? 'lib' : i < 5 ? 'pre' : i < 11 ? 'sul' : i >= 16 ? 'reb' : '';
document.getElementById('t').innerHTML = T.map(([c, p, j, v, e, d, gp, gc, f, mv], i) => `<tr class="${c === 'FLA' ? 'me' : ''}"><td class="n"><span class="zn ${zone(i)}">${i + 1}</span></td><td class="l cl"><span class="c">${crest(c, 20)}${CLUBS[c].n}</span></td><td class="pts">${p}</td><td>${j}</td><td>${v}</td><td>${e}</td><td>${d}</td><td>${gp}</td><td>${gc}</td><td>${gp - gc > 0 ? '+' : ''}${gp - gc}</td><td class="l" style="padding-left:24px"><span class="form">${[...f].map((r) => `<i class="${r}">${r.toUpperCase()}</i>`).join('')}</span></td><td class="mv ${mv > 0 ? 'up' : mv < 0 ? 'dn' : ''}">${mv > 0 ? '<i class="ph-fill ph-caret-up"></i>' + mv : mv < 0 ? '<i class="ph-fill ph-caret-down"></i>' + -mv : ''}</td></tr>`).join('');
// Real top scorers after round 30 (ESPN).
const A = [['CAP', 'Kevin Viveros', 'Athletico-PR', 21], ['FLA', 'Pedro', 'Flamengo', 16], ['SAN', 'Gabriel Barbosa', 'Santos', 14], ['GRE', 'Carlos Vinícius', 'Grêmio', 10], ['BAH', 'Luciano Juba', 'Bahia', 10], ['SAO', 'Jonathan Calleri', 'São Paulo', 10], ['BOT', 'Danilo', 'Botafogo', 10]];
document.getElementById('a').innerHTML = A.map(([c, n, cl, g], i) => `<div class="ar ${c === 'FLA' ? 'me' : ''}"><span class="k">${i + 1}</span>${crest(c, 22)}<div><b>${n}</b><small>${cl}</small></div><span class="g">${g}</span></div>`).join('');
</script>
</body>
</html>
