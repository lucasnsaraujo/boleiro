name: Release

# Builds the installers only when someone starts this workflow by hand (Actions tab → Release → Run workflow).
# It never runs on push, pull request or tag, and it never creates a GitHub release: the installers are
# workflow artifacts. Nothing is signed; docs/release.md says what signing needs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal .dmg)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
            bundle-dir: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
            artifact: boleiro-macos
          - name: Windows (NSIS .exe and .msi)
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis,msi
            bundle-dir: apps/desktop/src-tauri/target/release/bundle
            artifact: boleiro-windows
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/msi/*.msi
